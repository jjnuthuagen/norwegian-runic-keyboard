<style>
:root{--ground:#F1F2EF;--panel:#FFF;--ink:#191C1A;--muted:#6B756F;

@media (prefers-color-scheme:dark){:root{--ground:#141816;--panel:#1B201D;
 --ink:#E8EBE7;--muted:#94A099;--rule:#333A36;--accent:#7FBE9B;
 --accent-soft:#20302A;--faint:#3A433E}}
:root[data-theme="dark"]{--ground:#141816;--panel:#1B201D;--ink:#E8EBE7;
 --muted:#94A099;--rule:#333A36;--accent:#7FBE9B;--accent-soft:#20302A;--faint:#3A433E}
:root[data-theme="light"]{--ground:#F1F2EF;--panel:#FFF;--ink:#191C1A;
 --muted:#6B756F;--rule:#CBCFC8;--accent:#2F6E4F;--accent-soft:#E0EBE3;--faint:#C6CCC7}
*{box-sizing:border-box}
body{margin:0;padding:clamp(16px,4vw,40px);background:var(--ground);color:var(--ink);
 font-family:system-ui,-apple-system,"Segoe UI",Cantarell,sans-serif;line-height:1.55}
.wrap{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:26px}
h1{font-family:Georgia,serif;font-weight:400;font-size:clamp(24px,5vw,34px);margin:0}
.lede{margin:0;color:var(--muted);max-width:66ch}
h2{font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);margin:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
figure{margin:0;background:var(--panel);border:1px solid var(--rule);border-radius:10px;
 padding:14px 16px;display:flex;flex-direction:column;gap:8px}
svg{width:100%;height:auto;display:block}
.rest{fill:var(--faint)}
.part{fill:var(--accent)}
.rule{stroke:var(--rule);stroke-width:4}
.rule.dash{stroke-dasharray:16 14}
.rule.acc{stroke:var(--accent);stroke-dasharray:8 10;opacity:.7}
.dim{stroke:var(--accent);stroke-width:5}
.lab{font-size:30px;fill:var(--muted);font-family:system-ui,sans-serif}
.lab.mid{text-anchor:middle}
.lab.acc{fill:var(--accent)}
figcaption b{font-size:15px}
.en{color:var(--muted);font-size:13px;font-style:italic;margin-left:5px}
.d{display:block;color:var(--muted);font-size:13px;margin-top:3px}
.u{display:block;margin-top:6px;font-size:12px;color:var(--accent);font-weight:600;
 letter-spacing:.06em}
.metrics{background:var(--panel);border:1px solid var(--rule);border-radius:10px;padding:18px 20px}
</style>

<div class="wrap">
<header>
  <h1>Delene i en rune</h1>
  <p class="lede">Runene er satt sammen av et lite antall deler som går igjen.
  Å gi dem navn gjør det lettere å snakke om hva som skal endres — og det er
  de samme navnene som brukes i <code>runefont.py</code>. Delen som forklares
  er grønn; resten av runen står i grått.</p>
</header>
